<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather UI</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main
      class="d-flex flex-column vh-100 justify-content-center align-items-center"
    >
      <header class=" d-flex justify-content-center align-items-center gap-3">
        <input
          type="text"
          name="city"
          id="city"
          class="form-control"
          placeholder="Enter you City Name"
        />
        <button class="btn btn-primary" onclick="getCity()">search</button>
      </header>
      <div class="h-75 w-100 d-flex justify-content-center align-items-center">
        <div
          id="div2"
          class="w-50 d-flex justify-content-center align-items-center flex-column"
        >
          <h1 id="temp">35</h1>
          <span id="description">Mostly Cloud </span>

          <span id="country">India</span>
          <span id=" City_Name">Bhopal</span>
        </div>

        <div id="div3" class="w-50">
          <div id="temp_min" class="innerdiv">36</div>
          <div id="temp_max" class="innerdiv">42</div>
          <div id="sunrise" class="innerdiv">1779667545</div>
          <div id="sunset" class="innerdiv">1779715749</div>
          <div id="humidity" class="innerdiv">16</div>
          <div id="pressure" class="innerdiv">1003</div>
          <div id="sea_level" class="innerdiv">1003</div>
          <div id="wind" class="innerdiv">5.49</div>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
